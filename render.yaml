# Configurazione Render (Blueprint).
# Il database è Postgres su Neon: DATABASE_URL va impostata a mano nelle
# Environment variables di Render (sync: false = non viene sovrascritta).
services:
  - type: web
    name: qa-portfolio
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn qa_portfolio.wsgi:application"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.14.3"
