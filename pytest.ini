[pytest]
DJANGO_SETTINGS_MODULE = qa_portfolio.settings
# solo la suite di test del portfolio: la cartella qa_portfolio/form-automatico
# contiene lo script Playwright che popola gli highlight e NON va eseguita qui
testpaths = tests
markers =
    e2e: test end-to-end nel browser con Playwright (live server)
filterwarnings =
    ignore:No directory at:UserWarning
