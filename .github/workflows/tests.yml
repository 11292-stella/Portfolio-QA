name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements-dev.txt

      - name: Installa Chromium per Playwright
        run: python -m playwright install --with-deps chromium

      - name: Unit e integration test (Django)
        run: pytest tests/unit -v --junitxml=reports/unit.xml

      - name: Test E2E (Playwright)
        run: pytest tests/e2e -v --junitxml=reports/e2e.xml --tracing=retain-on-failure --output=reports/playwright

      - name: Carica report e trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
