{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Stella Marucelli — QA Automation{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'core/style.css' %}" rel="stylesheet">
</head>
<body>

    <nav class="navbar px-4">
        <a class="navbar-brand" href="{% url 'core:home' %}">Stella Marucelli</a>
        <span class="role-tag">qa_automation_engineer</span>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 mono">
        <p>&copy; 2026 Stella Marucelli</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
